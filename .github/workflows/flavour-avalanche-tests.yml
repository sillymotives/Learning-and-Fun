name: Flavour Avalanche Tests

on:
  push:
    branches:
      - feature/bartender-flavour-avalanche

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-adventure-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile adventure_game.py game/*.py
      - run: pytest -q

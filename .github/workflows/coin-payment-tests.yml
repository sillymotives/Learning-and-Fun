name: Coin Payment Tests

on:
  push:
    branches:
      - feature/coin-payment-consistency

permissions:
  contents: write

jobs:
  pytest:
    if: github.event.head_commit.message != 'Apply procedural drink behaviour'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-adventure-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/apply_drink_fix.py
      - run: python -m py_compile adventure_game.py game/*.py
      - run: pytest -q
      - name: Commit verified source
        run: |
          if git diff --quiet -- game/game.py; then
            exit 0
          fi
          git config user.name "sillymotives"
          git config user.email "pacman232@gmail.com"
          git add game/game.py
          git commit -m "Apply procedural drink behaviour"
          git push

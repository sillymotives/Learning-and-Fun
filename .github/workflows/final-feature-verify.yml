name: Final feature verifier

on:
  push:
    branches:
      - design/drink-obsession-and-100-combos
    paths-ignore:
      - ".ci/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
      - name: Checkout cleaned feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/drink-obsession-and-100-combos
          path: target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cleaned feature tree
        shell: bash
        run: |
          set +e
          cd target/text-adventure-game
          target_commit=$(git rev-parse HEAD)
          python -m pip install -r requirements.txt >/tmp/pip.log 2>&1
          install_code=$?
          python -m py_compile adventure_game.py game/*.py >/tmp/compile.log 2>&1
          compile_code=$?
          pytest -q >/tmp/pytest.log 2>&1
          pytest_code=$?
          git diff --check >/tmp/diff.log 2>&1
          diff_code=$?
          cd ../..

          mkdir -p .ci
          {
            echo "target_commit=$target_commit"
            echo "install_code=$install_code"
            echo "compile_code=$compile_code"
            echo "pytest_code=$pytest_code"
            echo "diff_code=$diff_code"
            echo "--- pytest ---"
            cat /tmp/pytest.log
            echo "--- compile ---"
            cat /tmp/compile.log
            echo "--- diff ---"
            cat /tmp/diff.log
          } > .ci/final-feature-result.txt

          git config user.name "final-feature-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add .ci/final-feature-result.txt
          git commit -m "Report final feature verification" || true
          git push

          if [ "$install_code" -ne 0 ] || [ "$compile_code" -ne 0 ] || [ "$pytest_code" -ne 0 ] || [ "$diff_code" -ne 0 ]; then
            exit 1
          fi

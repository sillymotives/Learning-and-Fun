name: Navigation State Tests

on:
  push:
    branches:
      - feature/map-alias-sad-bartender-paths

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-adventure-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/apply_navigation_state_feature.py
      - run: python tools/tune_navigation_state_feature.py
      - run: python -m py_compile adventure_game.py game/*.py
      - run: pytest -q
      - run: git diff --check
      - name: Commit verified source
        run: |
          if git diff --quiet -- game/game.py game/interactions.py game/flavour_expansion.py data/story.json; then
            exit 0
          fi
          git config user.name "sillymotives"
          git config user.email "pacman232@gmail.com"
          git add game/game.py game/interactions.py game/flavour_expansion.py data/story.json
          git commit -m "Add map alias, sad bartender, and zig-zag navigation"
          git push

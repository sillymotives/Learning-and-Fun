name: Lick States and Beast Drink Verification

on:
  push:
    branches:
      - feature/lick-states-and-beast-drink

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-adventure-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile adventure_game.py game/*.py
      - run: pytest -q tests/test_lick_states_and_beasts.py
      - run: pytest -q
      - run: git diff --check

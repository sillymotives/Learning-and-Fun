name: Lick States and Beast Drink GREEN

on:
  push:
    branches:
      - feature/lick-states-and-beast-drink

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-adventure-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/apply_lick_beast_feature.py
      - run: python tools/tune_lick_beast_feature.py
      - run: python -m py_compile adventure_game.py game/*.py
      - run: pytest -q tests/test_lick_states_and_beasts.py
      - run: pytest -q
      - run: git diff --check
      - name: Commit verified source
        run: |
          if git diff --quiet -- game/game.py game/interactions.py game/bartender_dialogue.py; then
            exit 0
          fi
          git config user.name "sillymotives"
          git config user.email "pacman232@gmail.com"
          git add game/game.py game/interactions.py game/bartender_dialogue.py
          git commit -m "Add bartender lick states and beast drink route"
          git push

name: Exploration Map Tests

on:
  push:
    branches:
      - feature/exploration-map-choice

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-adventure-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/apply_map_feature.py
      - run: python -m py_compile adventure_game.py game/*.py
      - run: pytest -q
      - run: git diff --check
      - name: Commit verified map source
        run: |
          if git diff --quiet -- game/game.py; then
            exit 0
          fi
          git config user.name "sillymotives"
          git config user.email "pacman232@gmail.com"
          git add game/game.py
          git commit -m "Add exploration-driven purchasable map"
          git push

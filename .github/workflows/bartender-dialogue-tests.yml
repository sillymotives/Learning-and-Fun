name: Bartender Dialogue Tests

on:
  push:
    branches:
      - feature/bartender-50-combinations

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-adventure-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/apply_bartender_boot_pass.py
      - run: python -m py_compile adventure_game.py game/*.py
      - run: pytest -q
      - run: git diff --check
      - name: Commit verified source
        run: |
          if git diff --quiet -- game/game.py game/bartender_dialogue.py; then
            exit 0
          fi
          git config user.name "sillymotives"
          git config user.email "pacman232@gmail.com"
          git add game/game.py game/bartender_dialogue.py
          git commit -m "Add combinatorial bartender dialogue and flaming boot cave route"
          git push

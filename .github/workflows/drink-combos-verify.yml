name: Drink combos verifier

on:
  push:
    branches:
      - feature/drink-obsession-and-100-combos

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text-adventure-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile adventure_game.py game/*.py
      - run: pytest -q
      - run: git diff --check

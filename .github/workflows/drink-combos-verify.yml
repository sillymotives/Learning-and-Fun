name: Drink combos verifier

on:
  push:
    branches:
      - feature/drink-obsession-and-100-combos
    paths-ignore:
      - ".ci/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/drink-obsession-and-100-combos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and report
        shell: bash
        run: |
          set +e
          cd text-adventure-game
          python -m pip install -r requirements.txt >/tmp/pip.log 2>&1
          install_code=$?
          python -m py_compile adventure_game.py game/*.py >/tmp/compile.log 2>&1
          compile_code=$?
          pytest -q >/tmp/pytest.log 2>&1
          pytest_code=$?
          git diff --check >/tmp/diff.log 2>&1
          diff_code=$?
          cd ..

          {
            echo "commit=$(git rev-parse HEAD)"
            echo "install_code=$install_code"
            echo "compile_code=$compile_code"
            echo "pytest_code=$pytest_code"
            echo "diff_code=$diff_code"
            echo "--- pytest ---"
            cat /tmp/pytest.log
            echo "--- compile ---"
            cat /tmp/compile.log
            echo "--- diff ---"
            cat /tmp/diff.log
          } > .ci-result.tmp

          mkdir -p .ci
          mv .ci-result.tmp .ci/drink-combos-result.txt
          git config user.name "drink-combos-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add .ci/drink-combos-result.txt
          git commit -m "Report drink combo verification" || true
          git push

          if [ "$install_code" -ne 0 ] || [ "$compile_code" -ne 0 ] || [ "$pytest_code" -ne 0 ] || [ "$diff_code" -ne 0 ]; then
            exit 1
          fi
